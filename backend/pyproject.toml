[project]
name = "projectops-backend"
version = "0.1.0"
description = "Backend foundation for ProjectOps."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.111,<1.0",
    "httpx>=0.27,<1.0",
    "cryptography>=50.0,<51.0",
    "PyJWT>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.3,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sentry-sdk>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9,<3.0",
    "pytest>=9.0.3,<10.0",
    "setuptools>=83.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
