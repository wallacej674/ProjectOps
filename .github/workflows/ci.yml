name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectops
          POSTGRES_PASSWORD: projectops
          POSTGRES_DB: projectops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectops -d projectops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECTOPS_ENVIRONMENT: test
      PROJECTOPS_DATABASE_URL: postgresql+psycopg://projectops:projectops@localhost:5432/projectops_test
      PROJECTOPS_TEST_DATABASE_URL: postgresql+psycopg://projectops:projectops@localhost:5432/projectops_test
      PROJECTOPS_CORS_ALLOWED_ORIGINS: http://localhost:5173
      PROJECTOPS_HEALTH_CHECK_TIMEOUT_SECONDS: "5"
      PROJECTOPS_AUTH_SECRET_KEY: ci-only-auth-secret-for-projectops-tests
      PROJECTOPS_ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Compile backend Python files
        working-directory: backend
        run: python -m compileall app tests

      - name: Check backend deployment config
        working-directory: backend
        run: python scripts/check_config.py

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit backend Python dependencies
        working-directory: backend
        run: python -m pip_audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm run audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  diff-hygiene:
    name: Diff Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            first_commit="$(git rev-list --max-parents=0 HEAD)"
            git diff --check "${first_commit}..HEAD"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
